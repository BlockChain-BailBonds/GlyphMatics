[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glyphmatics-wordart"
version = "1.0.0"
description = "GlyphMatics 333 visual-semantic bridge for Kaggle Word Art"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "918 Technologies"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
glyphmatics-wordart = "glyphmatics_wordart.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
glyphmatics_wordart = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
