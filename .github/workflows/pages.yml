name: Docs

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate docs tree
        run: |
          test -d docs
          test -n "$(find docs -type f -print -quit)"
      - name: Upload docs preview
        uses: actions/upload-artifact@v4
        with:
          name: glyphmatics-docs
          path: docs
          if-no-files-found: error
